name: Web2APK Builder

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Job ID dari bot"
        required: true
        type: string
      userId:
        description: "User ID Telegram"
        required: true
        type: string
      payload:
        description: "JSON {webUrl, appName, iconUrl}"
        required: true
        type: string

concurrency:
  group: web2apk-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  web2apk:
    name: "Web2APK [job=${{ github.event.inputs.jobId }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Parse payload
        id: parse
        run: |
          PAYLOAD='${{ github.event.inputs.payload }}'
          echo "WEB_URL=$(echo "$PAYLOAD"   | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url', d.get('webUrl','')))")"  >> $GITHUB_OUTPUT
          echo "APP_NAME=$(echo "$PAYLOAD"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('appName','MyApp'))")"           >> $GITHUB_OUTPUT
          echo "ICON_URL=$(echo "$PAYLOAD"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('iconUrl',''))")"                >> $GITHUB_OUTPUT
          echo "PKG=$(echo "$PAYLOAD"       | python3 -c "import sys,json,re; d=json.load(sys.stdin); n=d.get('appName','myapp').lower(); print('com.build.' + (re.sub(r'[^a-z0-9]','',n) or 'myapp'))")" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-web2apk-8.4
          restore-keys: |
            gradle-web2apk-

      - name: Install imagemagick
        run: sudo apt-get install -y -qq imagemagick

      - name: Create project structure
        run: |
          PKG="${{ steps.parse.outputs.PKG }}"
          PKGPATH=$(echo "$PKG" | tr '.' '/')
          mkdir -p /tmp/web2apk/app/src/main/java/$PKGPATH
          mkdir -p /tmp/web2apk/app/src/main/res/layout
          mkdir -p /tmp/web2apk/app/src/main/res/values
          for d in mipmap-hdpi mipmap-mdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "/tmp/web2apk/app/src/main/res/$d"
          done

          cat > /tmp/web2apk/build.gradle << 'EOF'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          echo "include ':app'" > /tmp/web2apk/settings.gradle

          cat > /tmp/web2apk/app/build.gradle << EOF
          plugins { id 'com.android.application' }
          android {
            namespace '$PKG'
            compileSdk 34
            defaultConfig {
              applicationId '$PKG'
              minSdk 21
              targetSdk 34
              versionCode 1
              versionName '1.0'
            }
            buildTypes {
              release { minifyEnabled false }
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.8.0'
          }
          EOF

          WEB_URL="${{ steps.parse.outputs.WEB_URL }}"
          APPNAME="${{ steps.parse.outputs.APP_NAME }}"

          cat > /tmp/web2apk/app/src/main/AndroidManifest.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <application
              android:label="${APPNAME}"
              android:icon="@mipmap/ic_launcher"
              android:theme="@style/AppTheme"
              android:usesCleartextTraffic="true">
              <activity android:name=".MainActivity"
                android:exported="true"
                android:configChanges="orientation|keyboardHidden|screenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > "/tmp/web2apk/app/src/main/java/$PKGPATH/MainActivity.java" << EOF
          package $PKG;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          public class MainActivity extends Activity {
            private WebView webView;
            @Override protected void onCreate(Bundle s) {
              super.onCreate(s);
              webView = new WebView(this);
              setContentView(webView);
              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setDomStorageEnabled(true);
              ws.setLoadWithOverviewMode(true);
              ws.setUseWideViewPort(true);
              ws.setCacheMode(WebSettings.LOAD_DEFAULT);
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              webView.loadUrl("${WEB_URL}");
            }
            @Override public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack(); else super.onBackPressed();
            }
          }
          EOF

          cat > /tmp/web2apk/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="AppTheme" parent="Theme.AppCompat.NoActionBar"/>
          </resources>
          EOF

          cat > /tmp/web2apk/app/src/main/res/values/strings.xml << EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">${APPNAME}</string>
          </resources>
          EOF

      - name: Download & resize icon
        run: |
          ICON_URL="${{ steps.parse.outputs.ICON_URL }}"
          declare -A sizes=([mipmap-mdpi]=48 [mipmap-hdpi]=72 [mipmap-xhdpi]=96 [mipmap-xxhdpi]=144 [mipmap-xxxhdpi]=192)
          if [ -n "$ICON_URL" ]; then
            curl -fsSL -o /tmp/icon_src.png "$ICON_URL" || true
            if [ -f /tmp/icon_src.png ] && [ -s /tmp/icon_src.png ]; then
              for dir in "${!sizes[@]}"; do
                sz="${sizes[$dir]}"
                convert /tmp/icon_src.png -resize "${sz}x${sz}" \
                  "/tmp/web2apk/app/src/main/res/$dir/ic_launcher.png" 2>/dev/null || \
                  cp /tmp/icon_src.png "/tmp/web2apk/app/src/main/res/$dir/ic_launcher.png"
                cp "/tmp/web2apk/app/src/main/res/$dir/ic_launcher.png" \
                   "/tmp/web2apk/app/src/main/res/$dir/ic_launcher_round.png" 2>/dev/null || true
              done
            fi
          else
            for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
              convert -size 192x192 xc:'#2196F3' \
                "/tmp/web2apk/app/src/main/res/$dir/ic_launcher.png" 2>/dev/null || true
              cp "/tmp/web2apk/app/src/main/res/$dir/ic_launcher.png" \
                 "/tmp/web2apk/app/src/main/res/$dir/ic_launcher_round.png" 2>/dev/null || true
            done
          fi

      - name: Setup Gradle wrapper
        working-directory: /tmp/web2apk
        run: |
          mkdir -p gradle/wrapper
          cat > gradle/wrapper/gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-bin.zip
          EOF
          # Pakai gradlew dari gradle wrapper plugin bawaan debian, fallback wget
          if command -v gradle &>/dev/null; then
            gradle wrapper --gradle-version 8.4 --quiet 2>/dev/null || true
          fi
          if [ ! -f gradlew ]; then
            curl -fsSL -o gradlew \
              "https://raw.githubusercontent.com/gradle/gradle/v8.4.0/gradlew"
          fi
          chmod +x gradlew

      - name: Build APK
        working-directory: /tmp/web2apk
        run: |
          ./gradlew assembleRelease \
            --no-daemon \
            --parallel \
            --build-cache \
            --configure-on-demand \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
            2>&1 | tee /tmp/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            ./gradlew assembleDebug \
              --no-daemon \
              --parallel \
              --build-cache \
              -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
              2>&1 | tee -a /tmp/build.log
          fi

      - name: Find APK
        id: findapk
        run: |
          APK=$(find /tmp/web2apk -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi
          DEST="/tmp/result-${{ github.event.inputs.jobId }}.apk"
          cp "$APK" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ steps.findapk.outputs.APK_PATH }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Build Log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.event.inputs.jobId }}
          path: /tmp/build.log
          retention-days: 1
          if-no-files-found: warn
