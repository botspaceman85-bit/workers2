name: Build Android Web2APK

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Unique build ID"
        required: true
        type: string
      userId:
        description: "Telegram user ID"
        required: false
        default: "0"
        type: string
      payload:
        description: "JSON payload from the bot"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: web2apk-${{ inputs.jobId }}
  cancel-in-progress: false

env:
  JOB_ID: ${{ inputs.jobId }}
  PUB_CACHE: ${{ github.workspace }}/.pub-cache
  CI: "true"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 35

    steps:
      - name: Checkout worker
        uses: actions/checkout@v4

      - name: Parse payload
        id: payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='${{ inputs.payload }}'
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          p=json.loads(os.environ['PAYLOAD'])
          def put(k,v):
              v=str(v).replace("%","%25").replace("\r","%0D").replace("\n","%0A")
              print(f"{k}={v}")
          put("url",p.get("url",""))
          put("app_name",p.get("appName","Web2APK"))
          put("build_type",p.get("buildType","release"))
          put("icon_url",p.get("iconUrl",""))
          PY

      - name: Validate URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${{ steps.payload.outputs.url }}" <<'PY'
          from urllib.parse import urlparse
          import sys
          u=urlparse(sys.argv[1])
          if u.scheme not in ("http","https") or not u.netloc:
              raise SystemExit("URL Web2APK tidak valid")
          PY

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-stable-${{ runner.os }}

      - name: Create WebView Flutter project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          safe="$(python3 - "${{ steps.payload.outputs.app_name }}" <<'PY'
          import re, sys
          s=re.sub(r'[^A-Za-z0-9_]+','_',sys.argv[1]).strip('_') or 'web2apk'
          if s[0].isdigit(): s='app_'+s
          print(s.lower()[:40])
          PY
          )"
          flutter create --platforms=android --project-name "$safe" project
          python3 scripts/write-webview.py \
            project \
            "${{ steps.payload.outputs.url }}" \
            "${{ steps.payload.outputs.app_name }}"

      - name: Download and install icon
        if: steps.payload.outputs.icon_url != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p project/android/app/src/main/res/drawable-nodpi
          curl --fail --location --retry 5 --retry-delay 2 \
            "${{ steps.payload.outputs.icon_url }}" \
            -o project/android/app/src/main/res/drawable-nodpi/app_icon.png
          file project/android/app/src/main/res/drawable-nodpi/app_icon.png || true
          python3 - <<'PY'
          from pathlib import Path
          p=Path("project/android/app/src/main/AndroidManifest.xml")
          s=p.read_text()
          if 'android:icon=' not in s:
              s=s.replace("<application ", '<application android:icon="@drawable/app_icon" ', 1)
          p.write_text(s)
          PY

      - name: Get dependencies
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.payload.outputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          found="$(find project/build/app/outputs/apk -type f -name '*.apk' | head -n 1 || true)"
          test -n "$found" || exit 1
          cp "$found" "artifact/${JOB_ID}.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.jobId }}
          path: artifact/${{ inputs.jobId }}.apk
          if-no-files-found: error
          retention-days: 1
