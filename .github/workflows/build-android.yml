name: Build Android APK (Native/Gradle)

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "Job ID dari bot"
        required: true
        type: string
      userId:
        description: "User ID Telegram"
        required: true
        type: string
      payload:
        description: "JSON payload {url, tag, appName, domain, color, iconUrl, buildType}"
        required: true
        type: string

concurrency:
  group: android-${{ github.event.inputs.jobId }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  build:
    name: "Android Build [job=${{ github.event.inputs.jobId }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Parse payload
        id: parse
        run: |
          PAYLOAD='${{ github.event.inputs.payload }}'
          echo "SOURCE_URL=$(echo "$PAYLOAD"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('url',''))")"       >> $GITHUB_OUTPUT
          echo "APP_NAME=$(echo "$PAYLOAD"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('appName',''))")"    >> $GITHUB_OUTPUT
          echo "DOMAIN=$(echo "$PAYLOAD"      | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('domain',''))")"     >> $GITHUB_OUTPUT
          echo "ICON_URL=$(echo "$PAYLOAD"    | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('iconUrl',''))")"    >> $GITHUB_OUTPUT
          echo "BUILD_TYPE=$(echo "$PAYLOAD"  | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('buildType','release'))")" >> $GITHUB_OUTPUT

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_URL: ${{ steps.parse.outputs.SOURCE_URL }}
        run: |
          echo "Downloading: $SOURCE_URL"

          HTTP_CODE=$(curl -fsSL \
            -H "Authorization: token $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -o /tmp/project.zip \
            -w "%{http_code}" \
            --retry 5 \
            --retry-delay 2 \
            --connect-timeout 15 \
            --max-time 120 \
            "$SOURCE_URL" || echo "000")

          FILE_SIZE=$(stat -c%s /tmp/project.zip 2>/dev/null || echo 0)
          echo "HTTP: $HTTP_CODE | Size: ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 1000 ]; then
            curl -fsSL \
              -o /tmp/project.zip \
              --retry 5 --retry-delay 2 \
              --connect-timeout 15 --max-time 120 \
              "$SOURCE_URL"
            FILE_SIZE=$(stat -c%s /tmp/project.zip 2>/dev/null || echo 0)
          fi

          if [ "$FILE_SIZE" -lt 1000 ]; then
            echo "ERROR: ZIP tidak valid (size: ${FILE_SIZE})"
            cat /tmp/project.zip
            exit 1
          fi

          unzip -q /tmp/project.zip -d /tmp/source
          rm -f /tmp/project.zip

          PROJ=$(find /tmp/source -name "build.gradle" -not -path "*/build/*" -not -path "*/app/*" | head -1 | xargs -r dirname)
          if [ -z "$PROJ" ]; then
            PROJ=$(find /tmp/source -name "build.gradle" -not -path "*/build/*" | head -1 | xargs -r dirname)
          fi

          echo "PROJECT_DIR=$PROJ" >> $GITHUB_ENV
          echo "Found: $PROJ"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-android-
            gradle-

      - name: Patch App Name
        if: ${{ steps.parse.outputs.APP_NAME != '' }}
        run: |
          find "$PROJECT_DIR" -name "strings.xml" -exec \
            sed -i "s|<string name=\"app_name\">.*</string>|<string name=\"app_name\">${{ steps.parse.outputs.APP_NAME }}</string>|g" {} + || true

      - name: Patch Domain
        if: ${{ steps.parse.outputs.DOMAIN != '' }}
        run: |
          find "$PROJECT_DIR" \( -name "*.java" -o -name "*.kt" \) | xargs \
            sed -i "s|https\?://[a-zA-Z0-9._:/?#&=%-]*|${{ steps.parse.outputs.DOMAIN }}|g" 2>/dev/null || true

      - name: Patch Icon
        if: ${{ steps.parse.outputs.ICON_URL != '' }}
        run: |
          curl -fsSL -o /tmp/ic_src.png "${{ steps.parse.outputs.ICON_URL }}" || true
          find "$PROJECT_DIR" -path "*/mipmap-*" -name "ic_launcher.png" | while read f; do
            cp /tmp/ic_src.png "$f" || true
            cp /tmp/ic_src.png "$(dirname $f)/ic_launcher_round.png" 2>/dev/null || true
          done

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew 2>/dev/null || true
          BUILD_TYPE="${{ steps.parse.outputs.BUILD_TYPE }}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            TASK="assembleDebug"
          else
            TASK="assembleRelease"
          fi
          ./gradlew "$TASK" \
            --no-daemon \
            --parallel \
            --build-cache \
            --configure-on-demand \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC" \
            2>&1 | tee /tmp/build.log
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            tail -60 /tmp/build.log
            exit 1
          fi

      - name: Find APK
        id: findapk
        run: |
          APK=$(find "$PROJECT_DIR/app/build/outputs" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK=$(find "$PROJECT_DIR/build" -name "*.apk" | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "ERROR: APK tidak ditemukan"
            exit 1
          fi
          DEST="/tmp/result-${{ github.event.inputs.jobId }}.apk"
          cp "$APK" "$DEST"
          echo "APK_PATH=$DEST" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.event.inputs.jobId }}
          path: ${{ steps.findapk.outputs.APK_PATH }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Upload Log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: log-${{ github.event.inputs.jobId }}
          path: /tmp/build.log
          retention-days: 1
          if-no-files-found: warn
